<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小步日常 · 家庭練習花園</title><meta name="description" content="彗瑄與邦盛的家庭日常練習與觀察紀錄"><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#home"><span class="logo">✳</span> 小步日常<small>FAMILY GROWTH GARDEN</small></a><div class="side-label">我們的練習花園</div><nav><a href="#home">⌂ <span>首頁</span></a><a href="#tasks">◷ <span>今日任務</span></a><a href="#records">▤ <span>日常紀錄</span></a><a href="#parent">◈ <span>家長檢視</span></a></nav><div class="sidebar-note"><span>🌱</span><b>每一小步，都算數。</b><p>慢慢練習，陪孩子找到<br>自己的節奏。</p></div><footer>家庭陪伴工具<br>不作為醫療診斷或治療</footer></aside><main><header><div><span class="eyebrow">一起練習，一起長大</span><div id="date"></div></div><div class="family-badge">☀ <span>徐家的小小練習室</span></div></header><div class="children"><button data-child="girl"><span class="avatar girl">瑄</span><span><b>徐彗瑄</b><small>8 歲 · 小學三年級</small></span><i>✓</i></button><button data-child="boy"><span class="avatar boy">盛</span><span><b>徐邦盛</b><small>6 歲 · 小學一年級</small></span><i>✓</i></button><span class="switch-help">每個孩子，都有自己的節奏</span></div><div id="app"></div><div id="toast" role="status"></div></main><dialog id="exercise"><form method="dialog"><button class="close" aria-label="關閉">×</button></form><span class="eyebrow">留一小段時間，陪自己練習</span><h2 id="exerciseTitle"></h2><p id="exerciseInstructions"></p><div class="timer" id="timer"><strong id="clock">05:00</strong><span>專心在這一小步</span></div><div class="timer-controls"><button id="toggleTimer" class="primary">開始計時</button><button id="resetTimer" class="secondary">重新計時</button></div><div class="prompt" id="exercisePrompt"></div><label>練習中的分心次數 <input id="sessionDistraction" type="number" min="0" max="999" value="0"></label><button id="finishTask" class="primary full">✓ 完成練習並打卡</button><small>可以暫停、提早結束；陪伴比完成速度重要。打卡不會自動發生。</small></dialog><script src="app.js"></script></body></html>
